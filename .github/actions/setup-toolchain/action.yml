name: Set up toolchain
description: Swap point. JDK 21 plus the Gradle and Sonar caches, as in the SonarQube Cloud GitHub Actions docs.
inputs:
  cache-prefix:
    description: Path prefix of the checkout when it is not the workspace root, for example "ws/".
    default: ""
  save-cache:
    description: Set to "false" for jobs that run agent-influenced code, so they cannot write caches that CI restores.
    default: "true"
runs:
  using: composite
  steps:
    # swap: Maven -> setup-java + ~/.m2, .NET -> setup-dotnet. https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/ci-based-analysis/github-actions-for-sonarcloud/
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "21"
    - if: inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.sonar/cache
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: build-${{ runner.os }}-${{ hashFiles(format('{0}**/*.gradle*', inputs.cache-prefix), format('{0}**/gradle-wrapper.properties', inputs.cache-prefix)) }}
        restore-keys: build-${{ runner.os }}-
    - if: inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.sonar/cache
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: build-${{ runner.os }}-${{ hashFiles(format('{0}**/*.gradle*', inputs.cache-prefix), format('{0}**/gradle-wrapper.properties', inputs.cache-prefix)) }}
        restore-keys: build-${{ runner.os }}-
