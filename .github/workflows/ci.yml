name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
permissions: {}
jobs:
  build:
    name: Build
    # Skip in the template repository itself, which has no application to build.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      # SWAP POINT 1 of 2, toolchain: JDK and caches for Gradle. Maven: keep setup-java, cache ~/.m2. .NET: setup-dotnet.
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      # SWAP POINT 2 of 2, build, test with coverage, analyze, and wait for the gate.
      # Set sonar.coverage.exclusions=.github/** so the factory's CI scripts, which have no unit-test coverage in the app's report, don't hold new_coverage at 0.
      # Maven, .NET, and scan-action variants: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/ci-based-analysis/github-actions-for-sonarcloud/
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build jacocoTestReport sonar --info -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600
